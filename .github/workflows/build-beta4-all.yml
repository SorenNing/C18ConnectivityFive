name: build-beta4-all-items
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Fetch beta4 baseline
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -L --fail --retry 3 -o dist/beta4.deb https://sorenning.github.io/debs/roothide/com.evgeniy558.controlcenter18_3.0-beta4_iphoneos-arm64e.deb
          echo 'e70f6422361b26563c9eff8f55baa6a3bc9fd84e07d76f317a77c08245e860ce  dist/beta4.deb' | shasum -a 256 -c -
          python3 tools/extract_deb.py dist/beta4.deb dist/base
      - name: Build companion engine
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build dist/pkg/Library/MobileSubstrate/DynamicLibraries
          SRC=(Tweak.m C18FiveConfig.m C18FiveModules.m C18FiveEditor.m C18SIMCard.m C18DataSwitch.m C18FiveColumn.m)
          for ARCH in arm64 arm64e; do
            xcrun --sdk iphoneos clang -fobjc-arc -O2 -isysroot "$SDK" -target "${ARCH}-apple-ios15.0" -dynamiclib -I. \
              -framework Foundation -framework UIKit -framework QuartzCore -framework CoreFoundation \
              -Wl,-undefined,dynamic_lookup -Wl,-install_name,@loader_path/C18ConnectivityFive.dylib \
              "${SRC[@]}" -o "build/C18ConnectivityFive-${ARCH}.dylib"
          done
          xcrun lipo -create -output build/C18ConnectivityFive.dylib build/C18ConnectivityFive-arm64.dylib build/C18ConnectivityFive-arm64e.dylib
          xcrun codesign --force --sign - --timestamp=none build/C18ConnectivityFive.dylib
      - name: Package integrated beta4
        run: |
          set -euo pipefail
          python3 tools/package_beta4.py
          shasum -a 256 dist/*.deb
          python3 tools/verify_beta4.py dist/com.evgeniy558.controlcenter18_3.0-beta4-five4_iphoneos-arm64e.deb
      - uses: actions/upload-artifact@v4
        with:
          name: controlcenter18-beta4-all-items
          path: dist/*.deb
          if-no-files-found: error
